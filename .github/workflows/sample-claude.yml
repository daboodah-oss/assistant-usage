name: sample-claude

# Claude lane sampler.  Owner: Fable (Claude).  See lanes/claude/README.md.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, off the :00 pile-up
  workflow_dispatch:

permissions:
  contents: write   # commit data/claude/usage.csv
  actions: write    # dispatch build-site (pushes by GITHUB_TOKEN do not trigger it)

# One sampler at a time, ever.  Refresh tokens rotate, so two overlapping runs
# would invalidate each other.  (Runners are ephemeral; a lockfile alone cannot
# protect across runs, this can.)
concurrency:
  group: sample-claude
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sample Claude usage
        env:
          CLAUDE_ACCESS_TOKEN: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          CLAUDE_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          CLAUDE_PLAN: ${{ vars.CLAUDE_PLAN }}
          CLAUDE_TOKEN_OUT: ${{ runner.temp }}/claude-rotated.json
          # Without the PAT below, rotated tokens cannot be saved, so do not
          # rotate at all (rotation would kill the refresh token for nothing).
          CLAUDE_NO_REFRESH: ${{ secrets.CLAUDE_SECRETS_PAT == '' && '1' || '0' }}
        run: |
          python3 lanes/claude/collect.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Persist rotated tokens back to repo secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_SECRETS_PAT }}
          ROTATED: ${{ runner.temp }}/claude-rotated.json
        run: |
          [ -f "$ROTATED" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Tokens rotated but CLAUDE_SECRETS_PAT is not set; re-provision the login (see lanes/claude/README.md)."
            exit 1
          fi
          # Refresh token first: the old one is already dead, so it is the critical one.
          for pair in refresh_token:CLAUDE_REFRESH_TOKEN access_token:CLAUDE_ACCESS_TOKEN; do
            key="${pair%%:*}"; secret="${pair##*:}"
            val=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]], end="")' "$ROTATED" "$key") || exit 1
            [ -n "$val" ] || { echo "::error::empty $key in rotated file"; exit 1; }
            printf %s "$val" | gh secret set "$secret" --repo "$GITHUB_REPOSITORY"
          done
          shred -u "$ROTATED" 2>/dev/null || rm -f "$ROTATED"
          echo "Rotated tokens saved to repo secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push sample
        id: push
        if: always()
        run: |
          git config user.name "Fable (claude lane)"
          git config user.email "claude-lane@users.noreply.github.com"
          git add data/claude/usage.csv
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "claude usage sample (auto)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Rebuild the shared page
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-site.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::could not dispatch build-site"
