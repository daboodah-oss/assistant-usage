name: build-site
on:
  push:
    paths: ['data/**', 'site/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 site/build.py
      - run: |
          git config user.name "Budzilla"
          git config user.email "budzilla@noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Site build (auto)" && git push)
