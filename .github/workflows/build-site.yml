name: build-site
on:
  push:
    paths: ['data/**', 'site/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 50}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 site/build.py
      - run: |
          git config user.name "Budzilla"
          git config user.email "budzilla@noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no site changes"; exit 0; fi
          git commit -m "Site build (auto)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Another run pushed index.html first. Rebuild on top of it instead of failing.
              git rebase --abort
              git reset --hard origin/main
              python3 site/build.py
              git add index.html
              if git diff --cached --quiet; then echo "no site changes"; exit 0; fi
              git commit -m "Site build (auto)"
            fi
            if git push origin main; then echo "site pushed"; exit 0; fi
            sleep $((i * 10))  # wait longer after each failed try (10s, 20s, ...) to ride out brief GitHub push errors
          done
          echo "site push failed after 5 attempts"
          exit 1
